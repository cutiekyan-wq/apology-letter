<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffc2d1" />
  <title>For My Lovie</title>
  <style>
    :root {
      --pink-1: #ffe5ec;
      --pink-2: #ffc2d1;
      --pink-3: #f7aef8;
      --pink-4: #b3e5fc;
      --rose: #d81b60;
      --text: #444444;
      --shadow: rgba(216, 27, 96, 0.15);
      --panel: rgba(255, 255, 255, 0.96);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      overscroll-behavior: none;
    }

    body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, var(--pink-1), var(--pink-2), var(--pink-3), var(--pink-4));
      background-size: 400% 400%;
      animation: gradientAnimation 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      perspective: 1000px;
      touch-action: manipulation;
    }

    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .stage {
      position: relative;
      width: min(90vw, 340px);
      height: min(72vh, 450px);
      min-height: 360px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .envelope-wrapper {
      position: relative;
      width: 100%;
      height: 210px;
      background: linear-gradient(180deg, #ffb9c7 0%, #ff9fb0 100%);
      border: 0;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      box-shadow: 0 15px 35px var(--shadow);
      cursor: pointer;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2;
      transform-origin: center top;
      overflow: visible;
      user-select: none;
      will-change: transform;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      appearance: none;
      -webkit-appearance: none;
      color: inherit;
      padding: 0;
      text-align: inherit;
    }

    .envelope-wrapper:focus-visible {
      outline: 3px solid rgba(216, 27, 96, 0.8);
      outline-offset: 6px;
      box-shadow: 0 0 0 6px rgba(216, 27, 96, 0.18), 0 15px 35px var(--shadow);
    }

    .envelope-wrapper::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 170px solid transparent;
      border-right: 170px solid transparent;
      border-top: 120px solid #ff8093;
      transform-origin: top center;
      transition: transform 0.5s ease 0.4s, z-index 0.2s ease 0.4s;
      z-index: 4;
      will-change: transform;
    }

    .envelope-wrapper::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 170px solid #ff99aa;
      border-right: 170px solid #ff99aa;
      border-bottom: 105px solid #ff99aa;
      border-top: 105px solid transparent;
      border-radius: 0 0 12px 12px;
      z-index: 3;
    }

    .heart-sticker {
      position: absolute;
      top: 105px;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.8rem;
      z-index: 5;
      transition: transform 0.3s ease, opacity 0.4s ease 0.6s;
      animation: pulse 2s infinite;
      user-select: none;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.12); }
    }

    .hint-text {
      position: absolute;
      bottom: -42px;
      width: 100%;
      text-align: center;
      color: var(--rose);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      transition: opacity 0.4s ease;
      user-select: none;
    }

    .letter-container {
      position: absolute;
      bottom: 5px;
      left: 8px;
      right: 8px;
      background: var(--panel);
      padding: 25px 20px 20px;
      border-radius: 16px;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.03);
      z-index: 1;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.45s, opacity 0.4s ease 0.4s, max-height 0.4s ease 0.45s;
      max-height: 190px;
      opacity: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }

    h1 {
      font-size: 1.3rem;
      color: var(--rose);
      margin-bottom: 12px;
      font-weight: 700;
    }

    p {
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .closing {
      margin-bottom: 0;
      font-weight: 700;
      color: var(--rose);
    }

    .envelope-wrapper.open {
      transform: translateY(110px);
      cursor: default;
    }

    .envelope-wrapper.open::before {
      transform: rotateX(180deg);
      z-index: 0;
    }

    .envelope-wrapper.open .heart-sticker {
      opacity: 0;
      pointer-events: none;
    }

    .envelope-wrapper.open .hint-text {
      opacity: 0;
    }

    .envelope-wrapper.open .letter-container {
      opacity: 1;
      transform: translateY(-135px);
      max-height: 380px;
      z-index: 6;
      box-shadow: 0 10px 30px rgba(216, 27, 96, 0.2);
    }

    .audio-controls {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(14px);
      z-index: 20;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s ease, visibility 0.35s ease, transform 0.35s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    body.audio-ready .audio-controls {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .audio-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      background: linear-gradient(135deg, #ff8db1, #d81b60);
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 22px rgba(216, 27, 96, 0.28);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease, opacity 0.2s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    .audio-button:disabled {
      cursor: not-allowed;
      opacity: 0.75;
      filter: grayscale(0.2);
    }

    body.audio-ready .audio-button {
      animation: audioReveal 0.5s ease-out;
    }

    @keyframes audioReveal {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.9);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes audioPulse {
      0%, 100% {
        box-shadow: 0 8px 22px rgba(216, 27, 96, 0.28);
      }
      50% {
        box-shadow: 0 10px 26px rgba(216, 27, 96, 0.42);
      }
    }

    body.audio-ready .audio-button {
      animation: audioReveal 0.5s ease-out, audioPulse 2.2s ease-in-out 0.5s infinite alternate;
    }

    .audio-button:hover,
    .audio-button:focus-visible {
      transform: translateY(-1px) scale(1.01);
      box-shadow: 0 10px 28px rgba(216, 27, 96, 0.34);
      filter: saturate(1.08);
      outline: none;
    }

    .audio-button.is-playing {
      background: linear-gradient(135deg, #ffb3c8, #ea3e84);
    }

    .audio-icon {
      font-size: 1.1rem;
      line-height: 1;
    }

    .audio-status {
      min-height: 1.1em;
      font-size: 0.72rem;
      font-weight: 600;
      color: rgba(68, 68, 68, 0.9);
      letter-spacing: 0.04em;
      text-align: center;
      opacity: 0;
      transform: translateY(2px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    body.audio-ready .audio-status.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .audio-status.error {
      color: #9b1c42;
    }

    .hearts-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .floating-heart {
      position: absolute;
      bottom: -50px;
      font-size: 1.5rem;
      opacity: 0;
      animation: floatUp 4s linear forwards;
      will-change: transform, opacity;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-105vh) translateX(var(--random-x)) rotate(var(--random-rotate));
        opacity: 0;
      }
    }

    @media (max-width: 420px) {
      .stage {
        height: 420px;
        min-height: 320px;
      }

      .envelope-wrapper {
        height: 200px;
      }

      .letter-container {
        padding: 20px 16px 16px;
      }

      h1 {
        font-size: 1.15rem;
      }

      p {
        font-size: 0.9rem;
      }

      .audio-button {
        padding: 10px 16px;
        font-size: 0.9rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      .floating-heart {
        animation: none;
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <button
      class="envelope-wrapper"
      id="envelope"
      type="button"
      aria-label="Open love letter"
      aria-expanded="false"
      aria-controls="letterContent"
    >
      <span class="sr-only">Open my apology letter</span>
      <div class="heart-sticker" aria-hidden="true">❤️</div>
      <div class="hint-text" aria-live="polite">TAP TO OPEN</div>

      <div class="letter-container" id="letterContent" aria-live="polite" onclick="event.stopPropagation();">
        <h1>Hi lovie,</h1>

        <p>
          I want to deeply apologize for how I have treated you over the last few months.
          I am so sorry for not cherishing you and for not valuing you to the point where
          you finally had enough.
        </p>

        <p>
          Please don't change who you are. I am trying my absolute best to give you the
          love and appreciation you deserve. To be honest, right now, I just feel a bit
          lost and don't quite know how to fix the hurt I caused.
        </p>

        <p>
          I know you are still hurt and disappointed, and an apology doesn't instantly fix
          that, but I truly hope you can accept it. I promise you that day by day, I am going
          to focus on becoming someone more patient, more caring, and more worthy of your trust.
        </p>

        <p class="closing">I love you, and I am so sorry.</p>
      </div>
    </button>
  </div>

  <div class="hearts-container" id="heartsContainer" aria-hidden="true"></div>

  <div class="audio-controls">
    <button id="audioButton" class="audio-button" type="button" aria-label="Play love song">
      <span class="audio-icon" aria-hidden="true">💖</span>
      <span class="audio-label">Play Audio</span>
    </button>
    <div id="audioStatus" class="audio-status" aria-live="polite"></div>
  </div>

  <audio id="bgMusic" loop preload="auto" playsinline crossorigin="anonymous">
    <source src="song.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const envelope = document.getElementById("envelope");
    const heartsContainer = document.getElementById("heartsContainer");
    const audio = document.getElementById("bgMusic");
    const audioButton = document.getElementById("audioButton");
    const audioStatus = document.getElementById("audioStatus");
    const hintText = document.querySelector(".hint-text");
    const MAX_HEARTS = 24;
    let opened = false;
    let heartInterval = null;

    function setHintText() {
      if (!hintText) return;
      hintText.textContent = opened ? "TAP TO CLOSE" : "TAP TO OPEN";
    }

    function setAudioStatus(message, isError = false) {
      if (!audioStatus) return;
      audioStatus.textContent = message || "";
      audioStatus.classList.toggle("error", isError);
      audioStatus.classList.toggle("visible", Boolean(message));
    }

    function setEnvelopeState() {
      envelope.setAttribute("aria-expanded", String(opened));
      envelope.classList.toggle("open", opened);
      setHintText();
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("floating-heart");

      const heartTypes = ["❤️", "💖", "💝", "💕", "🌸"];
      heart.innerText = heartTypes[Math.floor(Math.random() * heartTypes.length)];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (Math.random() * 1.2 + 0.8).toFixed(2) + "rem";
      heart.style.setProperty("--random-x", (Math.random() * 100 - 50) + "px");
      heart.style.setProperty("--random-rotate", (Math.random() * 360) + "deg");
      heart.style.animationDuration = (Math.random() * 2 + 3).toFixed(2) + "s";

      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }

    function updateAudioButtonState() {
      if (!audioButton) return;

      const isPlaying = audio && !audio.paused && !audio.muted;
      audioButton.classList.toggle("is-playing", isPlaying);
      const label = audioButton.querySelector(".audio-label");
      if (label) {
        label.textContent = isPlaying ? "Pause Audio" : "Play Audio";
      }
      audioButton.setAttribute("aria-label", isPlaying ? "Pause love song" : "Play love song");
    }

    function safePlayAudio() {
      if (!audio) return;

      const playPromise = audio.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise
          .then(() => {
            audio.muted = false;
            setAudioStatus("Music on ✨");
          })
          .catch(() => {
            audio.muted = true;
            audio.pause();
            audioButton.disabled = true;
            setAudioStatus("Audio unavailable on this device", true);
          });
      }

      updateAudioButtonState();
    }

    function toggleAudio() {
      if (!audio) return;

      if (!opened) {
        openEnvelope();
      }

      if (audio.paused) {
        safePlayAudio();
      } else {
        audio.pause();
        setAudioStatus("");
      }

      updateAudioButtonState();
    }

    function startHeartBurst() {
      if (heartInterval) return;

      const burst = () => {
        if (heartsContainer.children.length < MAX_HEARTS) {
          createHeart();
        }
      };

      burst();
      heartInterval = setInterval(burst, 300);
      setTimeout(() => {
        clearInterval(heartInterval);
        heartInterval = null;
      }, 5000);
    }

    function openEnvelope() {
      if (opened) return;
      opened = true;
      setEnvelopeState();
      document.body.classList.add("audio-ready");
      safePlayAudio();
      startHeartBurst();
    }

    function closeEnvelope() {
      if (!opened) return;
      opened = false;
      setEnvelopeState();
      if (audio && !audio.paused) {
        audio.pause();
      }
      updateAudioButtonState();
    }

    envelope.addEventListener("click", (event) => {
      if (event.target.closest(".letter-container")) return;
      if (opened) {
        closeEnvelope();
      } else {
        openEnvelope();
      }
    });

    envelope.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        if (opened) {
          closeEnvelope();
        } else {
          openEnvelope();
        }
      }
    });

    if (audioButton) {
      audioButton.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleAudio();
      });
    }

    if (audio) {
      audio.addEventListener("play", () => {
        setAudioStatus("Music on ✨");
        updateAudioButtonState();
      });

      audio.addEventListener("pause", () => {
        setAudioStatus("");
        updateAudioButtonState();
      });

      audio.addEventListener("ended", () => {
        setAudioStatus("Replay when you're ready 💞");
        updateAudioButtonState();
      });

      audio.addEventListener("error", () => {
        audioButton.disabled = true;
        audio.removeAttribute("src");
        audio.load();
        setAudioStatus("Audio unavailable on this device", true);
        updateAudioButtonState();
      }, { once: true });
    }

    setEnvelopeState();
    updateAudioButtonState();
  </script>
</body>
</html>
